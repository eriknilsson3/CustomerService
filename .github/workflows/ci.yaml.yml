name: CustomerService CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checka ut koden
        uses: actions/checkout@v4

      - name: Sätt up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: 'temurin'
          cache: "maven"

      - name: Gör maven wrapper executable
        run: chmod +x mvnw

      - name: Bygg och kör tester
        run:  ./mvnw -B test

      - name: Bygg applikation
        run: ./mvnw -B package -Dmaven.test.skip=true

      - name: Logga in på dockerhub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Sätt up Docker build
        uses: docker/setup-buildx-action@v4

      - name: Bygg och pusha Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/customerservice:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/customerservice:${{ github.sha }}